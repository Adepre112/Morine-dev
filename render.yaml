# Morine -- Render deployment configuration
#
# Architecture: GitHub -> Render Web Service -> Express -> MongoDB Atlas /
# Gemini / Job Listings API.
#
# Morine is SINGLE-ORIGIN. A single Express process serves the frontend, the
# /api/* routes and all static assets from one host, so there is no separate
# frontend service, no proxy and no cross-site cookie/CORS handling anywhere.
#
# How to use: push render.yaml to the default branch, then in the Render
# dashboard choose "New +" -> "Blueprint" and select this repository. Render
# reads this file, creates the service, and PROMPTS for the values of every
# `sync: false` secret. No secret values are stored in this file or in git.
#
# PORT is intentionally NOT declared. Render injects PORT itself, and
# server.js already reads `process.env.PORT || 3000`, so production binds to
# the injected port while local development stays on 3000.
#
# PRODUCTION HOST -- read this before changing anything in envVars.
#
#   The production service the team uses is  https://morine-ai.onrender.com
#   and it is the fully configured one (it has JOB_LISTING_API_KEY).
#
#   There is a SECOND, older Render service at https://morine.onrender.com.
#   It runs the same commit against the SAME MongoDB database but has a
#   different, incomplete environment (JOB_LISTING_API_KEY is missing there,
#   so /api/jobs answers 500 missing_api_key). It is legacy and must not be
#   treated as the frontend: nothing in this file points the frontend at it,
#   js/config.js resolves the API base to same-origin, and RESET_ALLOWED_HOSTS
#   below deliberately does not list it.
#
#   `name: morine` below is left as-is on purpose. Renaming it would rebind the
#   Blueprint to a different service, and that is a dashboard-side change this
#   file cannot verify. Anyone renaming the production service must update
#   `name`, RESET_ALLOWED_HOSTS and CANONICAL_PRODUCTION_HOST in
#   backend/controllers/authController.js together, or reset links will be
#   silently refused.

services:
  - type: web
    name: morine
    runtime: node
    plan: starter          # a paid plan; the free tier sleeps and has slow cold starts
    region: oregon         # closest MongoDB Atlas region to the developers
    branch: main

    # The whole application lives in this repository: Express in backend/,
    # the frontend (index.html, app.html, js/, css/, privacy/terms) at the root.
    rootDir: backend

    buildCommand: npm ci
    startCommand: npm start

    # /api/health is already routed in backend/server.js and is unauthenticated.
    healthCheckPath: /api/health

    # Graceful shutdown: server.js handles SIGTERM, stops accepting
    # connections, drains, then closes the MongoDB pool.
    autoDeploy: true

    envVars:
      # --- Application mode -------------------------------------------------
      - key: NODE_ENV
        value: production

      # --- Required secrets (Render prompts; never committed) ---------------
      - key: MONGODB_URI
        sync: false        # Atlas connection string (scheme included)

      - key: JWT_SECRET
        sync: false        # signs access + refresh tokens

      - key: JOB_LISTING_API_KEY
        sync: false        # Job Listings API (X-API-Key, server-side only)

      - key: GEMINI_API_KEY
        sync: false        # Gemini AI provider

      # --- Password-reset email (Brevo HTTPS API) -------------------------
      # PRODUCTION TRANSPORT. Render blocks outbound SMTP (25/465/587), so the
      # reset mail goes to Brevo's REST API over ordinary HTTPS (443) instead of
      # Nodemailer. EMAIL_PROVIDER=brevo is the ONLY switch that selects it:
      # controllers/authController.js reads nothing else to decide, and any other
      # value (including unset) keeps the legacy SMTP path. Without this line the
      # reset API still answers HTTP 200 and delivers nothing.
      - key: EMAIL_PROVIDER
        value: brevo

      # Brevo API key (xkeys). Read only into the `api-key` request header and
      # never logged. Create at https://app.brevo.com/settings/keys/api
      - key: BREVO_API_KEY
        sync: false

      # The sender address. MUST be a BARE address and MUST be registered and
      # verified in the Brevo account (https://app.brevo.com/settings/senders).
      # Do NOT write it as `"Morine <noreply@yourdomain.com>"`: Brevo's
      # sender.email field is `format: email` and rejects a display-name
      # wrapper with HTTP 400. services/emailService.js strips a wrapper if one
      # is present, but a bare address is unambiguous.
      - key: EMAIL_FROM
        sync: false

      # Sender display name, sent to Brevo as sender.name (max 70 chars).
      - key: EMAIL_FROM_NAME
        sync: false

      # Optional. Brevo request timeout in ms. Defaults to 10000, capped 60000.
      # EMAIL_TIMEOUT_MS=10000

      # --- Legacy SMTP fallback (local development only) -----------------
      # Retained so a developer without Brevo credentials can still send a reset
      # mail from localhost. NOT the production transport, and not read when
      # EMAIL_PROVIDER=brevo. On Render these cannot egress, which is why
      # production uses the HTTPS path above.
      - key: EMAIL_HOST
        sync: false        # e.g. smtp.gmail.com
      - key: EMAIL_PORT
        sync: false        # 587 for STARTTLS, 465 for implicit TLS
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false        # Gmail: an App Password, not the account password

      # --- Password-reset link host --------------------------------------
      # The reset link is built from the request Host header, which is
      # attacker-controlled, so authController.js only emits a link for a host
      # on this allowlist. Declaring it here makes the production origin
      # explicit configuration instead of an in-code fallback constant, and it
      # must list the host the production frontend is actually served from:
      #   https://morine-ai.onrender.com
      # morine.onrender.com is a separate legacy service on the same database
      # and is deliberately NOT listed: it is not the production frontend, and
      # a reset submitted there must not mint a link pointing at it.
      # Multiple hosts: comma-separated. A leading "." opts an entry into
      # subdomains, e.g. ".yourdomain.com".
      - key: RESET_ALLOWED_HOSTS
        value: morine-ai.onrender.com

      # --- Optional configuration ------------------------------------------
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: JWT_ACCESS_EXPIRES_IN
        value: 30m

      # JWT_ACCESS_SECRET / JWT_REFRESH_SECRET are deliberately not declared:
      # auth middleware falls back to JWT_SECRET when they are absent, and
      # omitting them keeps the Blueprint prompt list to the values that are
      # genuinely required.

      # FRONTEND_URL is intentionally NOT set. Morine is same-origin, so no
      # CORS is required and none is mounted when this variable is absent.
      # Only set it if a genuinely separate, deliberate extra origin ever needs
      # to be allow-listed.
      # - key: FRONTEND_URL
      #   sync: false        # e.g., https://morine.example.com
